server:
  port: 8083
  servlet:
    context-path: /api/fhir

cql-translator:
  version: @cqframework.version@

spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  profiles:
    active: local

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

mat-api-key: ${MAT_API_KEY:DISABLED}

info:
  app:
    name: Cql Elm Translation Services

madie:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8088/api}
  fhir-cache: ${FHIR_CACHE_DIR:}
  library:
    service:
      baseUrl: ${CQL_LIBRARY_SERVICE_URL:http://localhost:8082/api}
      cql:
        uri: /cql-libraries/cql

springdoc:
  swagger-ui:
    path: /swagger

logging:
  level:
    root: ${LOG_LEVEL:DEBUG}
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %mdc %-5level %logger{36}.%M - %msg%n"

okta:
  oauth2:
    issuer: ${OKTA_ISSUER:https://dev-madie.okta.com/oauth2/default}
    audience: ${OKTA_AUDIENCE:api://default}
